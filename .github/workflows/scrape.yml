# 三省招标抓取 · 定时任务
#
# ⚠️ 重要说明（实测结论 2026-11-08）
# GitHub Actions 的运行服务器位于境外（Azure 美国西部），实测无法访问：
#   山东 www.ccgp-shandong.gov.cn:8087 → Network is unreachable
#   安徽 zfcg.ah.gov.cn                → 返回拦截页（非 JSON）
#   新疆 www.ccgp-xinjiang.gov.cn      → 渲染 0 条
# 因此本工作流的「定时自动抓取」在 GitHub 上无法生效，schedule 已注释。
# 保留文件是为了将来接入境内 runner 或阿里云 FC / 腾讯云 SCF 时复用。
#
# 当前可用的更新方式：
#   助手在境内环境执行 scraper.py → 推送到本仓库 → GitHub Pages 自动重新发布。

name: scrape-tenders

on:
  # schedule:
  #   - cron: "0 22 * * *"   # UTC 22:00 = 北京时间次日 6:00
  #   - cron: "0 6 * * *"    # UTC 6:00  = 北京时间 14:00
  workflow_dispatch: {}     # 仅手动触发（需境内网络环境）

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          pip install requests playwright
          playwright install chromium --with-deps

      - name: 抓取三省公告
        run: python scraper.py

      - name: 提交数据
        run: |
          git config user.name "tenders-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/tenders.json
          git diff --cached --quiet && echo "无更新" || git commit -m "数据更新 $(date -u +%F\ %H:%M) UTC"
          git push
