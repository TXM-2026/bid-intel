<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>投标情报台 · 消毒与医疗器械</title>
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --ink:#1a2233; --sub:#5b6472; --line:#e5e9f0;
  --navy:#1e3a8a; --navy2:#2748b0; --red:#c0392b; --red-bg:#fdecec;
  --amber:#b45309; --amber-bg:#fef3e2; --green:#15803d; --green-bg:#e8f6ee;
  --blue-bg:#eaf0fb; --grey:#8892a0; --grey-bg:#eef1f5;
  --shadow:0 1px 3px rgba(20,30,60,.08),0 4px 14px rgba(20,30,60,.06);
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6}
header{background:linear-gradient(120deg,#152a63,#1e3a8a 55%,#2748b0);color:#fff;padding:20px 0 0;position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(15,30,80,.25)}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
.brand{display:flex;align-items:center;gap:12px;padding-bottom:14px}
.logo{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:20px}
.brand h1{font-size:19px;font-weight:700;letter-spacing:.5px}
.brand span{font-size:12px;opacity:.75;display:block;font-weight:400}
nav{display:flex;gap:4px}
nav button{flex:1;border:none;background:transparent;color:rgba(255,255,255,.72);font-size:14px;padding:11px 8px;cursor:pointer;font-family:inherit;border-bottom:3px solid transparent;transition:.15s}
nav button.on{color:#fff;font-weight:600;border-bottom-color:#fbbf24;background:rgba(255,255,255,.06)}
main{padding:20px 0 60px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.stat b{font-size:24px;display:block;line-height:1.2}
.stat i{font-style:normal;font-size:12px;color:var(--sub)}
.stat.hot b{color:var(--red)} .stat.money b{color:var(--navy)} .stat.warn b{color:var(--amber)} .stat.ok b{color:var(--green)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.toolbar input[type=text]{flex:1;min-width:200px;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:13px;font-family:inherit;background:var(--card)}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 13px;font-size:12.5px;cursor:pointer;color:var(--sub);transition:.15s;font-family:inherit}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:500}
.btn{border:none;border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer;font-family:inherit;transition:.15s;font-weight:500}
.btn-primary{background:var(--navy);color:#fff} .btn-primary:hover{background:var(--navy2)}
.btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--sub)}
.btn-danger{background:transparent;color:var(--red);border:1px solid #f3c4bd}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;padding:16px 18px;position:relative}
.ntag{padding:1px 8px;border-radius:6px;font-size:10.5px;font-weight:700;margin-right:6px;white-space:nowrap}
.ntag-bid{background:var(--green-bg);color:var(--green)}
.ntag-closed{background:var(--grey-bg);color:var(--grey)}
.ntag-unk{background:var(--amber-bg);color:var(--amber)}
.card.closed{opacity:.6;background:#fbfbfc}
.card .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.card h3{font-size:15px;font-weight:600}
.tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:10px;font-weight:500;margin-right:5px;vertical-align:1px}
.t-dis{background:#fde8e8;color:var(--red)} .t-dev{background:var(--blue-bg);color:var(--navy)} .t-res{background:var(--amber-bg);color:var(--amber)}
.p-A{background:var(--red);color:#fff} .p-B{background:#d97706;color:#fff} .p-C{background:var(--grey);color:#fff}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--sub);margin:8px 0 6px}
.meta b{color:var(--ink);font-weight:600}
.note{font-size:12.5px;color:var(--sub);background:var(--grey-bg);border-radius:8px;padding:8px 11px;margin-top:8px}
.dd{font-size:12px;font-weight:700;padding:3px 10px;border-radius:12px;white-space:nowrap}
.dd-0{background:var(--red);color:#fff} .dd-3{background:var(--red-bg);color:var(--red)}
.dd-7{background:var(--amber-bg);color:var(--amber)} .dd-ok{background:var(--green-bg);color:var(--green)}
.dd-exp{background:var(--grey-bg);color:var(--grey)}
.extlinks{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:flex;flex-wrap:wrap;gap:8px}
.extlinks a{font-size:12px;color:var(--navy);text-decoration:none;background:var(--blue-bg);padding:4px 11px;border-radius:6px}
.extlinks a:hover{text-decoration:underline}
.remotebar{background:linear-gradient(90deg,#0b3d2e,#14532d);color:#d1fae5;border-radius:10px;padding:8px 14px;font-size:12.5px;margin-bottom:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
.empty{text-align:center;color:var(--grey);padding:60px 0}
.sel{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;background:var(--card);color:var(--ink)}
mark{background:#fde68a;padding:0 2px;border-radius:3px}
.card.hot3{border-left:4px solid var(--red)}
.card.hot7{border-left:4px solid #d97706}
.card.fav{box-shadow:0 0 0 2px rgba(245,158,11,.4),var(--shadow)}
.lab.fav{box-shadow:0 0 0 2px rgba(245,158,11,.45),var(--shadow)}
.star{border:none;background:transparent;font-size:18px;line-height:1;cursor:pointer;color:#cbd5e1;padding:2px 4px}
.star.on{color:#f59e0b}
.star:hover{transform:scale(1.2)}
.pf-search{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:13px;font-family:inherit;margin-top:10px}
.cat-tag{font-size:11px;color:var(--navy);background:var(--blue-bg);padding:2px 8px;border-radius:9px;margin-right:6px;white-space:nowrap}
/* kanban */
.kb{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
.kbcol{flex:0 0 212px;background:var(--grey-bg);border-radius:var(--radius);padding:8px;max-width:212px}
.kbhead{font-size:12.5px;font-weight:700;color:var(--sub);padding:4px 6px;display:flex;justify-content:space-between;align-items:center}
.kbhead span{background:var(--card);border-radius:9px;padding:0 8px;font-size:11px;color:var(--sub)}
.kbcard{background:var(--card);border-radius:9px;box-shadow:var(--shadow);padding:9px 10px;margin-bottom:8px}
.kbcard.hot3{border-left:3px solid var(--red)}
.kbt{font-size:12.8px;font-weight:600;line-height:1.4}
.kbm{font-size:11.5px;color:var(--sub);margin:4px 0}
.kbb{display:flex;gap:5px}
.kbb button{border:1px solid var(--line);background:var(--card);border-radius:6px;font-size:12px;padding:2px 9px;cursor:pointer;color:var(--sub);font-family:inherit}
.kbb button:hover:not(:disabled){border-color:var(--navy);color:var(--navy)}
.kbb button:disabled{opacity:.35;cursor:default}
.kbb .x{margin-left:auto;color:var(--red)}
.kbempty{font-size:11.5px;color:var(--grey);text-align:center;padding:10px 0}
/* modal */
.mask{position:fixed;inset:0;background:rgba(15,25,50,.5);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 16px;overflow:auto}
.mask.on{display:flex}
.modal{background:var(--card);border-radius:14px;max-width:640px;width:100%;padding:22px 24px}
.modal h2{font-size:17px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:4px;font-weight:500}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13px;font-family:inherit}
.field textarea{resize:vertical;min-height:64px}
.modal .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
/* pitfalls */
.pf-layout{display:grid;grid-template-columns:190px 1fr;gap:16px}
.pf-nav{position:sticky;top:130px;align-self:start}
.pf-nav button{display:block;width:100%;text-align:left;border:none;background:transparent;padding:10px 13px;border-radius:8px;font-size:13.5px;cursor:pointer;color:var(--sub);font-family:inherit}
.pf-nav button.on{background:var(--card);color:var(--navy);font-weight:600;box-shadow:var(--shadow)}
.progress{background:var(--card);border-radius:var(--radius);padding:14px 18px;box-shadow:var(--shadow);margin-bottom:14px}
.bar{height:8px;background:var(--grey-bg);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#15803d,#22c55e);border-radius:6px;transition:width .4s}
.pf-item{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:10px;padding:14px 16px;display:flex;gap:12px}
.pf-item input[type=checkbox]{width:18px;height:18px;margin-top:3px;accent-color:var(--green);cursor:pointer;flex-shrink:0}
.pf-item.done h4{text-decoration:line-through;color:var(--grey)}
.pf-item h4{font-size:14px;margin-bottom:4px}
.pf-item .row{font-size:12.8px;color:var(--sub);margin-top:3px}
.pf-item .row b{color:var(--ink)}
.sev{font-size:11px;padding:1px 8px;border-radius:9px;margin-left:6px;font-weight:500}
.sev-kill{background:var(--red-bg);color:var(--red)}
/* labs */
.lab{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;padding:16px 18px}
.lab h3{font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lab .loc{font-size:12.5px;color:var(--sub)}
.badge{font-size:11px;padding:2px 9px;border-radius:10px;font-weight:500}
.badge-official{background:#e0edff;color:#1d4ed8} .badge-3rd{background:#f3e8ff;color:#7e22ce}
.caps{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0}
.caps span{font-size:11.5px;background:var(--grey-bg);border-radius:6px;padding:3px 9px;color:#475569}
.lab p{font-size:12.8px;color:var(--sub);margin-top:6px}
.kit{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.kit h3{font-size:15px;margin-bottom:10px;padding-bottom:9px;border-bottom:2px solid var(--blue-bg)}
.kit ul{list-style:none}
.kit li{font-size:13px;padding:6px 0 6px 20px;position:relative;border-bottom:1px dashed var(--line)}
.kit li:last-child{border:none}
.kit li::before{content:"✓";position:absolute;left:2px;color:var(--green);font-weight:700}
.kit li b{color:var(--navy)}
.warnbox{background:var(--red-bg);border:1px solid #f5c9c2;border-radius:var(--radius);padding:13px 16px;font-size:12.8px;color:#7f1d1d;margin-bottom:14px}
h2.sec{font-size:16px;margin:24px 0 12px;display:flex;align-items:center;gap:8px}
h2.sec::before{content:"";width:4px;height:16px;background:var(--navy);border-radius:2px}
.muted{font-size:12px;color:var(--grey);margin-top:6px}
@media(max-width:760px){.pf-layout{grid-template-columns:1fr}.pf-nav{position:static;display:flex;flex-wrap:wrap;gap:6px}.pf-nav button{width:auto}nav{flex-wrap:wrap}nav button{min-width:96px;font-size:13px;padding:9px 6px}.kbcol{flex:0 0 196px}}
</style>
</head>

      <div class="field"><label>采购单位</label><input id="f_buyer"></div>
      <div class="field"><label>城市</label><input id="f_city"></div>
      <div class="field"><label>品类线</label><select id="f_cat"><option>消毒产品</option><option>医疗器械</option><option>需求调研（前置）</option></select></div>

      <div class="field"><label>投标截止 *</label><input id="f_dd" type="datetime-local"></div>
      <div class="field"><label>文件获取截止（可空）</label><input id="f_docdl" type="datetime-local"></div>
      <div class="field" style="grid-column:1/-1"><label>公告链接（可空）</label><input id="f_url" placeholder="https://..."></div>
      <div class="field" style="grid-column:1/-1"><label>备注</label><textarea id="f_note" placeholder="关键要求、资质门槛、联系人等"></textarea></div>
    </div>
    <div class="acts">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveTender()">保存</button>
    </div>
  </div>
</div>

/* 远程抓取数据（由 scraper.py 定时生成 data/tenders.json） */
let REMOTE={updatedAt:"",items:[]};
function remoteToTenders(){
  return (REMOTE.items||[]).map((r,i)=>({
    id:"r"+i+"_"+(r.date||""),cat:(/消毒|灭菌|卫生用品|抗抑菌/.test(r.title)?"消毒产品":"医疗器械"),
    prio:"C",prov:r.province||"",city:r.city||"",buyer:r.agency||"",name:r.title,target:"自动抓取",
    budget:(r.budget&&r.budget>0)?r.budget:null,dd:r.deadline||"",docdl:"",
    plat:r.province+" · 自动抓取",note:r.method?("采购方式："+r.method):"",
    url:r.url||"",contact:""
  })).filter(t=>t.name);
}
function loadRemote(){
  fetch("data/tenders.json",{cache:"no-store"}).then(r=>r.json()).then(j=>{
    if(j&&j.items){REMOTE=j; if(TAB==="radar") render();}
  }).catch(()=>{});
}
const LS = "tbqt_v1";
let state = {added:[],removed:[],checks:{},favs:[],track:{}};
try{ const s = localStorage.getItem(LS); if(s) state = Object.assign(state, JSON.parse(s)); }catch(e){}
function persist(){ localStorage.setItem(LS, JSON.stringify(state)); }
function allTenders(){
  const base = SEED_TENDERS.filter(t=>!state.removed.includes(t.id)).concat(state.added);
  const rem = remoteToTenders().filter(rt=>!base.some(b=>b.name===rt.name));
  return base.concat(rem)
    .sort((a,b)=>{const da=dl(a),db=dl(b);return (da?da.getTime():Infinity)-(db?db.getTime():Infinity);});
}
function dl(t){
  const ds=[t.dd,t.docdl].filter(Boolean).map(d=>new Date(d));
  ds.sort((a,b)=>a-b); return ds[0]||null;
}
function daysLeft(t){ const d=dl(t); if(!d) return null; return Math.floor((d-new Date())/86400000); }
function fmt(dtstr){ if(!dtstr)return "—"; const d=new Date(dtstr);
  return (d.getMonth()+1)+"月"+d.getDate()+"日 "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }

/* 公告类型判定：只有"招标/采购/谈判/询价"这类才可能投标；结果、合同、验收均已结束 */
function noticeType(t){
  const s=t.name||"";
  if(/结果公告|中标|成交公告|合同公示|验收公告|废标公告|终止公告|流标|已签/.test(s)) return "closed";
  if(/招标公告|采购公告|谈判公告|询价公告|磋商公告|比选公告|竞价公告|招标文件/.test(s)) return "bid";
  if((t.plat||"").indexOf("自动抓取")<0) return "bid";   // 人工录入的项目默认可投
  return "unk";
}

const PROV_MAP={"黄山":"安徽","合肥":"安徽","成都":"四川","柳州":"广西","贵阳":"贵州","武汉":"湖北","南通":"江苏","惠州":"广东","肇庆":"广东","西安":"陕西","林芝":"西藏","黔东南":"贵州","南京":"江苏","郑州":"河南","杭州":"浙江","济南":"山东","沈阳":"辽宁","长春":"吉林","昆明":"云南","广州":"广东"};
function provOf(t){
  if(t.prov) return t.prov;
  const m=(t.plat||"").match(/^(山东|安徽|新疆)/);
  if(m) return m[1];
  const c=t.city||"";
  for(const k in PROV_MAP){ if(c.indexOf(k)===0) return PROV_MAP[k]; }
  return "其他";
}

  return `<div class="card ${hotCls} ${isFav?"fav":""} ${nt==="closed"?"closed":""}">
    <div class="top">
      <div>${ntag}<span class="p-${t.prio}" style="padding:2px 9px;border-radius:9px;font-size:11px;font-weight:700;margin-right:6px">${t.prio}</span>
        <span class="tag ${tagcls}">${t.cat}</span><b style="font-size:14.5px">${esc(t.name)}</b></div>
      <div style="display:flex;gap:6px;align-items:center">
        <button class="star ${isFav?"on":""}" onclick="fav('${t.id}')" title="重点跟进 / 加入进度看板">★</button>${dd}
        <button class="btn btn-danger" style="padding:3px 10px;font-size:11.5px" onclick="delTender('${t.id}',${isSeed})" title="从列表移除">移除</button></div>
    </div>
    <div class="meta">
      <span>🏥 <b>${esc(t.buyer||"—")}</b></span>
      <span>📍 ${esc(t.city||"—")}<i style="font-style:normal;color:var(--grey);font-size:11.5px">（${provOf(t)}）</i></span>
      <span>💰 ${t.budget?("¥ "+t.budget.toLocaleString()):"预算未公开"}</span>
      <span>⏰ ${dlInfo}</span>
      ${t.docdl?`<span>📄 文件获取截止 ${fmt(t.docdl)}</span>`:""}
      <span>🗂 ${esc(t.plat||"")}</span>
      ${t.contact?`<span>☎ ${esc(t.contact)}</span>`:""}
    </div>
    ${t.note?`<div class="note">${esc(t.note)}</div>`:""}
    ${t.url?`<div class="extlinks"><a href="${esc(t.url)}" target="_blank">查看公告原文 ↗</a>
      <a href="https://search.ccgp.gov.cn/bxsearch?searchtype=1&bidSort=0&pinMu=0&bidType=0&kw=${encodeURIComponent(t.buyer||t.name.slice(0,6))}" target="_blank">在政采网查该采购人 ↗</a></div>`:""}
  </div>`;
}
function fav(id){
  const i=state.favs.indexOf(id);
  if(i>=0) state.favs.splice(i,1); else state.favs.push(id);
  persist(); render();
}
function delTender(id,isSeed){
  if(isSeed) state.removed.push(id); else state.added=state.added.filter(t=>t.id!==id);
  persist(); render();
}
function openModal(){
  document.getElementById("mask").classList.add("on");
  ["f_name","f_buyer","f_city","f_budget","f_url","f_note"].forEach(i=>document.getElementById(i).value="");
}
function closeModal(){ document.getElementById("mask").classList.remove("on"); }
document.getElementById("mask").addEventListener("click",e=>{if(e.target.id==="mask")closeModal();});
function saveTender(){
  const name=document.getElementById("f_name").value.trim();
  const dd=document.getElementById("f_dd").value;
  if(!name||!dd){alert("项目名称和投标截止为必填");return;}
  state.added.push({id:"u"+Date.now(),cat:document.getElementById("f_cat").value,
    prio:"B",city:document.getElementById("f_city").value.trim(),
    buyer:document.getElementById("f_buyer").value.trim(),name,
    target:"",budget:+document.getElementById("f_budget").value||null,
    dd,docdl:document.getElementById("f_docdl").value||"",plat:"手动添加",
    note:document.getElementById("f_note").value.trim(),url:document.getElementById("f_url").value.trim(),contact:""});
  persist(); closeModal(); TAB="radar"; render();
}

/* ================= 避雷指南 ================= */
let pfCat=0, pfKw="";
function pitRow(k,it,catLabel){
  const on=!!state.checks[k];
  return `<div class="pf-item ${on?"done":""}">
    <input type="checkbox" ${on?"checked":""} onchange="state.checks['${k}']=this.checked;persist();render()">
    <div><h4>${catLabel?`<span class="cat-tag">${catLabel}</span>`:""}${it.t}${it.k?`<span class="sev sev-kill">废标级</span>`:""}</h4>
      <div class="row"><b>踩坑场景：</b>${it.s}</div>
      <div class="row"><b>避雷做法：</b><span style="color:var(--green)">✓</span> ${it.a}</div></div>
  </div>`;
}
function renderPitfall(){
  const cats=PITFALLS.map(c=>c.cat);
  const total=PITFALLS.reduce((s,c)=>s+c.items.length,0);
  const done=PITFALLS.reduce((s,c)=>s+c.items.filter((_,i)=>state.checks[c.cat+i]).length,0);
  let body;
  if(pfKw){
    const flat=[]; PITFALLS.forEach(c=>c.items.forEach((it,i)=>{if((it.t+it.s+it.a).includes(pfKw))flat.push({k:c.cat+i,it,cat:c.cat});}));
    body = flat.length? flat.map(x=>pitRow(x.k,x.it,x.cat)).join("") : `<div class="empty">没有匹配的避雷条目</div>`;
  }else{
    body = `<div class="pf-layout">
    <div class="pf-nav">
      ${cats.map((c,i)=>`<button class="${pfCat===i?"on":""}" onclick="pfCat=${i};render()">${c}（${PITFALLS[i].items.length}）</button>`).join("")}
      <button style="color:var(--red);font-size:12.5px" onclick="state.checks={};persist();render()">↺ 重置勾选</button>
    </div>
    <div>${PITFALLS[pfCat].items.map((it,i)=>pitRow(PITFALLS[pfCat].cat+i,it,null)).join("")}</div>
  </div>`;
  }
  const cases = pfKw ? REAL_CASES.filter(c=>(c.n+c.what+c.lesson+c.loc).includes(pfKw)) : REAL_CASES;
  const caseSec = `
  <h2 class="sec">真实废标案例（${cases.length} 起 · 均附官方处理决定原文）</h2>
  <p class="muted" style="margin-bottom:10px">来源全部为财政局/政府采购监管部门的公开公告，不限于医疗行业，但废标成因完全通用——重点看每条的「给你的教训」。</p>
  ${cases.map(c=>`<div class="lab">
    <h3>⚖️ ${c.n}</h3>
    <div class="loc">📄 出处：${c.loc}</div>
    <p><b>案情与结果：</b>${c.what}</p>
    <p style="color:var(--green)"><b>给你的教训：</b>${c.lesson}</p>
    <div class="extlinks"><a href="${c.u}" target="_blank">处理决定 / 公告原文 ↗</a></div>
  </div>`).join("") || `<div class="empty">没有匹配的案例</div>`}`;
  view.innerHTML=`
  <div class="progress">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <b style="font-size:15px">投标前自查进度</b>
      <span style="font-size:12.5px;color:var(--sub)">${done} / ${total} 项已自查${done===total?" · ✅ 可以递交了":""}</span>
    </div>
    <div class="bar"><i style="width:${done/total*100}%"></i></div>
    <input type="text" class="pf-search" placeholder="搜索避雷条目，如：盖章、限价、检测报告、保证金…" value="${pfKw}" oninput="pfKw=this.value;render()">
    <p class="muted">勾选你已完成核对的条目；换项目时点「重置」重新来一遍。带 <span class="sev sev-kill">废标级</span> 的条目一旦触发无法补救。手机上此页可直接当清单翻。</p>
  </div>
  ${body}
  ${caseSec}`;
}

/* ================= 检验机构 ================= */
let labType="all", labKw="";
const COMMON_CAPS=["稳定性","毒理","杀灭","微生物","环氧乙烷","电磁兼容","生物学评价","抗抑菌","一次性卫生用品","IVD","洁净"];
function renderLabs(){
  const kw=labKw.trim();
  const labs=LABS.filter(l=>(labType==="all"||l.type===labType) &&
    (!kw || (l.n+l.city+l.d+l.caps.join("")).includes(kw)));
  const hi=s=> kw && s.includes(kw) ? s.split(kw).join("<mark>"+kw+"</mark>") : s;
  view.innerHTML=`
  <div class="warnbox">⚠️ 选择检测机构时，别只看「有没有 CMA」——要核对 <b>CMA 证书附表</b>是否覆盖你产品的<b>每一个检测参数</b>（参数级能力）。范围不符的报告备案会被退回。机构信息会随时间变化，送检前以官网最新公示为准。</div>
  <div class="toolbar">
    <input type="text" placeholder="按检测项目 / 机构名 / 城市搜，如：稳定性、毒理、环氧乙烷…" value="${labKw}" oninput="labKw=this.value;render()" style="flex:2;min-width:240px">
    ${[["all","全部"],["official","官方 / 疾控 / 器检院"],["third","第三方 CMA"]].map(x=>
      `<button class="chip ${labType===x[0]?"on":""}" onclick="labType='${x[0]}';render()">${x[1]}</button>`).join("")}
  </div>
  <div class="toolbar">
    <span style="font-size:12.5px;color:var(--sub)">常用检测项目，点一下直接搜：</span>
    ${COMMON_CAPS.map(c=>`<button class="chip ${labKw===c?"on":""}" onclick="labKw=labKw==='${c}'?'':'${c}';render()">${c}</button>`).join("")}
  </div>
  ${labs.length? labs.map(l=>{
    const hit=l.caps.some(c=>kw&&c.includes(kw));
    return `<div class="lab ${hit?"fav":""}">
    <h3>${hi(l.n)}<span class="badge ${l.type==="official"?"badge-official":"badge-3rd"}">${l.type==="official"?"官方事业单位":"第三方"}</span>
      ${hit?`<span class="badge" style="background:var(--amber-bg);color:var(--amber)">✓ 覆盖「${esc(kw)}」</span>`:""}</h3>
    <div class="loc">📍 ${l.city}</div>
    <div class="caps">${l.caps.map(c=>`<span>${hi(c)}</span>`).join("")}</div>
    <p>${l.d}</p>
    <div class="extlinks"><a href="${l.u}" target="_blank">能力详情 / 来源 ↗</a></div>
  </div>`;}).join("") : `<div class="empty">没有覆盖该项目的机构——可换个近义词（如「灭菌」「消毒」）再试，或考虑送省疾控咨询</div>`}
  <h2 class="sec">WS 628-2018 检测项目速查（消毒产品）</h2>
  <div class="kit"><ul>${KIT.map(k=>`<li>${k}</li>`).join("")}</ul></div>
  <p class="muted">标准原文：国家卫健委官网公开 PDF《消毒产品卫生安全评价技术要求》（WS 628-2018），检测项目对照表见附录 B–G。配套标准：《消毒技术规范》2002年版、WS/T 10009-2023《消毒产品检测方法》、GB 38598 标签说明书通用要求。</p>`;
}

/* ================= 数据管理 ================= */
function renderData(){
  view.innerHTML=`
  <div class="kit">
    <h3>数据管理</h3>
    <p style="font-size:13px;color:var(--sub)">所有新增项目、移除记录和自查勾选都保存在本机浏览器（localStorage）。换电脑或清缓存前，先导出备份。</p>
    <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">
      <button class="btn btn-primary" onclick="exportData()">⬇ 导出备份（JSON）</button>
      <label class="btn btn-ghost" style="position:relative">⬆ 导入备份<input type="file" accept=".json" style="position:absolute;inset:0;opacity:0;cursor:pointer" onchange="importData(this)"></label>
      <button class="btn btn-danger" onclick="if(confirm('清空所有本地修改（新增/移除/勾选/重点/进度），恢复内置数据？')){state={added:[],removed:[],checks:{},favs:[],track:{}};persist();render();}">↺ 恢复出厂</button>
    </div>
    <p class="muted" style="margin-top:14px">当前本地状态：新增 ${state.added.length} 个项目 · 移除 ${state.removed.length} 个内置项目 · 自查勾选 ${Object.keys(state.checks).length} 项 · ★ 重点 ${state.favs.length} 个 · 看板跟踪 ${Object.keys(state.track).length} 个</p>
  </div>
  <div class="kit">
    <h3>本应用的使用建议</h3>
    <ul>
      <li><b>招标雷达</b>：内置项目是快照 + 三省自动抓取；用省份下拉只看山东/安徽/新疆，点 ★ 把要投的项目加入重点，预算排序用来快速找大单</li>
      <li><b>投标进度</b>：★ 过的项目自动进看板，6 个阶段（关注→报名→买标书→做标书→投标→开标），← → 推进状态</li>
      <li><b>避雷指南</b>：每投一个标过一遍全部条目，顶部搜索框可按关键词查（如「盖章」「限价」），重点盯「废标级」标记</li>
      <li><b>检验机构</b>：点「稳定性 / 毒理 / 环氧乙烷」等常用项目标签，直接筛出覆盖该项目的机构，绿色描边 = 能力表命中</li>
      <li><b>下一步扩展</b>：自动抓取已就绪（见 README 部署文档），后续可加多人协作或微信推送</li>
    </ul>
  </div>`;
}
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="投标情报台备份_"+new Date().toISOString().slice(0,10)+".json";a.click();
}
function importData(input){
  const f=input.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{state=Object.assign({added:[],removed:[],checks:{},favs:[],track:{}},JSON.parse(r.result));persist();alert("导入成功");render();}catch(e){alert("文件格式不正确");}};
  r.readAsText(f);
}
render();
loadRemote();
</script>
</body>
</html>
